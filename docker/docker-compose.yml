services:
  workinworld:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: workinworld_app
    restart: unless-stopped
    ports:
      - "8082:3000"
    environment:
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
